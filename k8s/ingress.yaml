apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deploy-status-ingress
  namespace: deploy-status-checker
spec:
  ingressClassName: nginx
  rules:
    - host: deploy-status.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000
